name: "Running This Execution-Zone Module Against logosctl"
output: logos-execution-zone-runtime.md
release: ""

intro: |
  `logos-execution-zone` is a Logos `core` module that wraps the
  [Logos execution-zone wallet library](https://github.com/logos-blockchain/lssa)
  (`wallet_ffi`) to provide wallet lifecycle, account management, balance and
  block queries, transfers, and account-id encoding. This
  doc-test exercises **this** execution-zone-module commit end-to-end through the
  headless `logosctl` runtime:

  1. Build the `logosctl` CLI from its published flake. `logosctl` is the
     headless frontend for `logos-liblogos`, so building it brings in the whole
     module-runtime stack (`logos_host`, `liblogos_core`, the IPC layer).
  2. Build **this** execution-zone module as an installable `.lgx` package
     straight from its own flake's `#lgx` output, **pinned to the commit under
     test** — so the module you run is built from exactly what is checked out
     here, not the latest published release.
  3. Start a `logosctl` daemon and install the `.lgx` into its session.
  4. Load `logos_execution_zone`, introspect it with `module show`, and call its
     wallet-free methods —
     verifying the module actually runs and round-trips real values through
     `wallet_ffi`.

  The methods exercised here — `name`/`version` and the base58 account-id codec
  (`account_id_to_base58` / `account_id_from_base58`) — are the module's
  deterministic, **offline** surface: they need neither an open wallet nor a live
  sequencer, so a green run is reproducible in CI. The stateful operations
  (creating accounts, transfers, sync) require a running
  sequencer and network, and are covered by the module's unit tests (mocked
  `wallet_ffi`) and integration tests (real `wallet_ffi`) instead.

  Because the module is built from the commit under test and then loaded and
  called through a real `logosctl` daemon, a green run is real evidence that
  this change keeps the execution-zone module loadable and callable.

what_you_build: "This `logos_execution_zone` module, packaged as `.lgx`, installed into a `logosctl` session, and called through its daemon."

what_you_learn:
  - How to build the `logosctl` runtime from its flake
  - How a module's flake exposes a ready-to-install `.lgx` via its `#lgx` output
  - How to install an `.lgx` into a `logosctl` session
  - How to start the `logosctl` daemon, load a module, introspect it, and call its methods
  - How to shut the daemon down and confirm it has exited

prerequisites:
  - |
    **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:

    ```bash
    mkdir -p ~/.config/nix
    echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
    ```

    Verify: `nix flake --help >/dev/null 2>&1 && echo "Flakes enabled"`
  - "**A Linux or macOS machine.**"

sections:
  - title: "Build logosctl"
    step: true
    text: |
      Build the `logosctl` CLI from its published flake. The result is symlinked to
      `./logos/`. `logosctl` is the headless frontend for `logos-liblogos`, so this
      one build brings in the whole module-runtime stack the daemon needs.
    steps:
      - title: "Build the CLI"
        run: "nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos"
        code_block: |
          nix build 'github:logos-co/logos-logoscore-cli#ctl' --out-link ./logos
        check_file: "logos/bin/logosctl"
        post_text: |
          The build produces `logos/bin/logosctl` plus bundled runtime libraries
          and a `logos/modules/` directory containing the built-in
          `capability_module` (required for the auth handshake when loading
          modules).

  - title: "Build and install this execution-zone module"
    step: true
    text: |
      Build **this** execution-zone module's `.lgx` straight from its flake's
      `#lgx` output, start a daemon, and install the package into its session.
      Every module built with
      [`logos-module-builder`](https://github.com/logos-co/logos-module-builder)
      exposes a ready-to-install `#lgx`.

      > The `{release}` in the URL is what pins the build to a specific commit: the
      > doc-test runner expands it to a concrete ref. Locally that is this
      > checkout's `HEAD` (see `run.sh`); in CI it is the commit being tested. With
      > no pin it falls back to the latest `master`.
    steps:
      - title: "Build the module's .lgx"
        text: |
          Build the `#lgx` output and link it as `./lez-lgx`. (This compiles the
          module and the `wallet_ffi` library it depends on through Nix, so the
          first build is slow.)
        run: "nix build 'github:logos-blockchain/logos-execution-zone-module{release}#lgx' -o lez-lgx"
        code_block: |
          # From inside the clone this is simply: nix build '.#lgx'
          nix build 'github:logos-blockchain/logos-execution-zone-module{release}#lgx' -o lez-lgx
        post_text: "The `.lgx` package is now under `./lez-lgx/`:"
        extra_run:
          run: "ls lez-lgx/*.lgx"

      - title: "Start the daemon"
        text: |
          Start a `logosctl` daemon. Its session directory, `./session`, holds the
          daemon's config, its installed modules and their data. `--detach`
          returns once the daemon accepts commands.
        # The bundled package downloader starts a storage node in $HOME; keep it
        # out of the real one.
        run: "mkdir -p home && HOME=\"$PWD/home\" ./logos/bin/logosctl --config-dir ./session daemon start --detach"
        code_block: "logosctl daemon start --detach"
        expect_contains:
          - "Daemon started"

      - title: "Install the .lgx"
        text: |
          A path ending in `.lgx` installs from disk, with no catalog involved. A
          local build is unsigned, which the session's default policy accepts with
          a warning. `-y` confirms, since there is no terminal to ask on.
        run: "./logos/bin/logosctl --config-dir ./session install lez-lgx/*.lgx -y"
        code_block: "logosctl install lez-lgx/*.lgx -y"
        expect_contains:
          - '"installed":["lez_core"]'

      - title: "Confirm the install"
        text: "List the session's packages and confirm the module landed:"
        run: "./logos/bin/logosctl --config-dir ./session package ls"
        code_block: "logosctl package ls"
        expect_contains:
          - "lez_core"
        check_file: "session/modules/lez_core/manifest.json"

  - title: "Call the module"
    step: true
    text: |
      Load `logos_execution_zone`, introspect it, and call several of its methods
      with the client subcommands. The daemon logs to `session/logs/daemon.log`.
    steps:
      - title: "Inspect the startup log"
        text: "Review the daemon's startup output:"
        run: "cat session/logs/daemon.log"

      - title: "Check daemon status"
        text: "Verify the daemon is running:"
        run: "./logos/bin/logosctl --config-dir ./session daemon status"
        code_block: "logosctl daemon status"

      - title: "List discovered modules"
        text: "`lez_core` should be visible in the scan directory:"
        run: "./logos/bin/logosctl --config-dir ./session module ls"
        code_block: "logosctl module ls"
        expect_contains:
          - "lez_core"

      - title: "Load the module"
        text: "Load `lez_core` into the running daemon:"
        run: "./logos/bin/logosctl --config-dir ./session module load lez_core"
        code_block: "logosctl module load lez_core"
        expect_contains:
          - "lez_core"

      - title: "Confirm the module is loaded"
        text: |
          Re-run `daemon status`; the module that was `not_loaded` before now reports
          `loaded`:
        run: "./logos/bin/logosctl --config-dir ./session daemon status"
        code_block: "logosctl daemon status"
        expect_contains:
          - "lez_core"
          - '"status":"loaded"'

      - title: "Introspect the module with module show"
        text: |
          `module show` lists the methods the module exposes — the same methods you
          can `call`:
        run: "./logos/bin/logosctl --config-dir ./session module show lez_core"
        code_block: "logosctl module show lez_core"
        expect_contains:
          - "lez_core"

      - title: "Read the module name"
        text: |
          `name` returns the module's own identifier — the simplest possible
          round-trip through the loaded plugin over liblogos' IPC:
        run: "./logos/bin/logosctl --config-dir ./session call lez_core name"
        code_block: "logosctl call lez_core name"
        expect_contains:
          - '"result":"lez_core"'

      - title: "Read the module version"
        text: |
          `version` returns the module's semantic version (`0.5.1`), matching
          `metadata.json`:
        run: "./logos/bin/logosctl --config-dir ./session call lez_core version"
        code_block: "logosctl call lez_core version"
        expect_contains:
          - '"result":"0.5.1"'

      - title: "Encode an account id to base58"
        text: |
          `account_id_to_base58` takes a 32-byte account id as 64 hex characters
          and returns its base58 form. This is a pure encoding helper in
          `wallet_ffi` — no open wallet and no network required, so it runs
          entirely offline:
        run: "./logos/bin/logosctl --config-dir ./session call lez_core account_id_to_base58 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        code_block: "logosctl call lez_core account_id_to_base58 aaaaaaaa...aaaa  # 64 hex chars"
        expect_contains:
          - '"result"'

      - title: "Round-trip it back to hex"
        text: |
          `account_id_from_base58` is the inverse: feed it the base58 string we just
          produced and it returns the original 64-hex account id. Encoding then
          decoding the same id and recovering the input is a deterministic,
          end-to-end proof that the codec — and the IPC path to this module — work:
        run: |
          ENC=$(./logos/bin/logosctl --config-dir ./session call lez_core account_id_to_base58 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa)
          B58=$(printf '%s' "$ENC" | sed -n 's/.*"result":"\([^"]*\)".*/\1/p')
          echo "encoded: $B58"
          ./logos/bin/logosctl --config-dir ./session call lez_core account_id_from_base58 "$B58"
        code_block: |
          # Encode, then decode the result back — the round-trip returns the input.
          B58=$(logosctl call lez_core account_id_to_base58 aaaa...aaaa)
          logosctl call lez_core account_id_from_base58 "$B58"
        expect_contains:
          - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

      - title: "Reject malformed base58"
        text: |
          Decoding obvious garbage fails cleanly: `account_id_from_base58` returns
          an empty result rather than crashing the module or the daemon:
        run: "./logos/bin/logosctl --config-dir ./session call lez_core account_id_from_base58 '!!!not-base58!!!'"
        code_block: "logosctl call lez_core account_id_from_base58 '!!!not-base58!!!'"
        expect_contains:
          - '"result":""'

      - title: "Stop the daemon"
        text: "Shut the daemon down cleanly:"
        run: "./logos/bin/logosctl --config-dir ./session daemon stop"
        code_block: "logosctl daemon stop"
        post_text: |
          The daemon removes its state file and exits.

      - title: "Confirm the daemon has stopped"
        text: |
          With no daemon running, the client reports `not_running` and exits
          non-zero, so we add `|| true` to let the doc-test assert on the output:
        run: "./logos/bin/logosctl --config-dir ./session daemon status || true"
        code_block: "logosctl daemon status"
        expect_contains:
          - '"status":"not_running"'
